<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a13" />
      <stop offset="50%" stop-color="#0b1022" />
      <stop offset="100%" stop-color="#050810" />
    </linearGradient>

    <!-- Glowing Orbs -->
    <radialGradient id="glowIndigo" cx="20%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowCyan" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="glowViolet" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <!-- Text & Element Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e0e7ff" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.8" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.6" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.15" />
    </pattern>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" />
    </filter>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="20" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Ambient Glows -->
  <circle cx="250" cy="120" r="300" fill="url(#glowIndigo)" />
  <circle cx="950" cy="300" r="320" fill="url(#glowCyan)" />
  <circle cx="600" cy="200" r="280" fill="url(#glowViolet)" />

  <!-- Flow Lines (Abstract Vector Graph) -->
  <path d="M 50 350 Q 300 200 600 320 T 1150 180" fill="none" stroke="url(#accentGrad)" stroke-width="2" stroke-opacity="0.25" stroke-dasharray="6 6" />
  <path d="M 100 100 Q 400 300 800 150 T 1100 350" fill="none" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.2" />

  <!-- Left Side: Branding and Hero Text -->
  <g transform="translate(80, 80)">
    <!-- Pill Badge -->
    <rect x="0" y="0" width="230" height="32" rx="16" fill="#1e1b4b" stroke="#4f46e5" stroke-opacity="0.5" stroke-width="1" />
    <circle cx="16" cy="16" r="5" fill="#10b981" />
    <text x="30" y="21" fill="#c7d2fe" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" letter-spacing="1">NEXT-GEN PRECISION ENGINE</text>

    <!-- Main Title -->
    <g transform="translate(0, 75)">
      <!-- Logo Icon -->
      <rect x="0" y="-38" width="48" height="48" rx="12" fill="url(#accentGrad)" />
      <path d="M 14 -14 L 24 -24 L 34 -14 M 34 -24 L 24 -14 L 14 -24" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
      
      <text x="64" y="0" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="800" letter-spacing="-1">UNITFLOW</text>
      <text x="360" y="-18" fill="#6366f1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700">v1.0</text>
    </g>

    <!-- Subtitle -->
    <text x="0" y="115" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="17" font-weight="400">
      Ultra-fast, high-precision unit &amp; currency converter for engineering, science &amp; daily workflow.
    </text>
    <text x="0" y="140" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      ⚡ Live Math Expressions &bull; 🌐 Real-time Exchange Rates &bull; 📐 Step-by-Step Formulas &bull; 🔒 100% Offline
    </text>

    <!-- Feature Pills / Badges -->
    <g transform="translate(0, 175)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="115" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="12" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">⚛️ React 19</text>

      <!-- Pill 2 -->
      <rect x="125" y="0" width="125" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="137" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">🔷 TypeScript</text>

      <!-- Pill 3 -->
      <rect x="260" y="0" width="135" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="272" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">🎨 Tailwind v4</text>

      <!-- Pill 4 -->
      <rect x="405" y="0" width="120" height="28" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1" />
      <text x="417" y="18" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="500">⚡ Vite + Vitest</text>
    </g>
  </g>

  <!-- Right Side: Interactive Mockup Card -->
  <g transform="translate(730, 65)" filter="url(#cardShadow)">
    <!-- Glassmorphic Card Container -->
    <rect x="0" y="0" width="390" height="290" rx="16" fill="url(#cardGrad)" stroke="url(#borderGrad)" stroke-width="1.5" />

    <!-- Card Header -->
    <rect x="0" y="0" width="390" height="42" rx="16" fill="#0f172a" fill-opacity="0.8" />
    <circle cx="24" cy="21" r="5" fill="#ef4444" />
    <circle cx="40" cy="21" r="5" fill="#f59e0b" />
    <circle cx="56" cy="21" r="5" fill="#10b981" />
    <text x="145" y="26" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600">unitflow.app/live</text>

    <!-- Card Content: Convert Length Example -->
    <!-- Input Box -->
    <g transform="translate(24, 60)">
      <rect x="0" y="0" width="342" height="52" rx="10" fill="#0b0f19" stroke="#334155" stroke-width="1" />
      <text x="16" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">INPUT (MATH EXPRESSION)</text>
      <text x="16" y="44" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="700">120 * 2.5 + 40</text>
      <text x="270" y="40" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Kilometers</text>
    </g>

    <!-- Swap Indicator -->
    <g transform="translate(180, 120)">
      <circle cx="15" cy="10" r="14" fill="#4f46e5" />
      <path d="M 12 7 L 18 7 M 18 7 L 16 5 M 18 13 L 12 13 M 12 13 L 14 15" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Output Box -->
    <g transform="translate(24, 142)">
      <rect x="0" y="0" width="342" height="62" rx="10" fill="#111827" stroke="#4f46e5" stroke-width="1.2" stroke-opacity="0.8" />
      <text x="16" y="22" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="10" font-weight="600">CONVERTED RESULT (MILES)</text>
      <text x="16" y="48" fill="#ffffff" font-family="'JetBrains Mono', monospace" font-size="22" font-weight="800">211.266</text>
      <text x="125" y="48" fill="#34d399" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="600">mi</text>
      <text x="280" y="44" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="13" font-weight="600">Miles</text>
    </g>

    <!-- Multi-Unit Quick Preview Grid (mini) -->
    <g transform="translate(24, 218)">
      <rect x="0" y="0" width="106" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="10" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">METERS</text>
      <text x="10" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">340,000 m</text>

      <rect x="118" y="0" width="106" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="128" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">FEET</text>
      <text x="128" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">1.115e+6 ft</text>

      <rect x="236" y="0" width="106" height="48" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1" />
      <text x="246" y="18" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="9" font-weight="600">NAUTICAL MI</text>
      <text x="246" y="38" fill="#e2e8f0" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="700">183.58 NM</text>
    </g>
  </g>
</svg>
